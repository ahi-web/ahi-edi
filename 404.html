  .content {
    flex: 1;
    display: flex;
    justify-content: center;
    padding: 0 24px;
  }
  .inner {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding-top: 52px;
  }
  .logo {
    display: block;
    text-align: center;
    margin-bottom: 36px;
  }
  .logo img {
    width: 310px;
    max-width: 100%;
    height: auto;
  }
  .notice {
    text-align: center;
    font-size: 17px;
    line-height: 1.6;
  }
  .notice p { margin: 0 0 1.1em; }
  .notice a {
    color: var(--blue);
    text-decoration: underline;
  }
  footer {
    margin-top: auto;
    padding: 40px 0 24px;
    text-align: center;
    font-size: 11px;
    line-height: 1.8;
    text-transform: uppercase;
    color: var(--muted);
  }
  footer ul { list-style: none; margin: 0; padding: 0; }
  footer li { display: inline; }
  footer a { color: inherit; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer p { margin: 0; }

  @media (max-width: 768px) {
    .page { flex-direction: column; }
    .banner { flex: 0 0 220px; background-position: center 20%; }
    .inner { min-height: 0; padding-top: 32px; }
    .content { padding: 0 16px; }
  }
</style>
